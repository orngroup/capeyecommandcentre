<style>

/* ── SHARED BASE STYLES ── */
:root{
  --bg:#f4f6f9;--bg2:#fff;--bg3:#f0f2f6;--bg4:#eef0f5;
  --border:#e2e6ed;--border2:#c8d0dc;
  --red:#C8102E;--red2:#a00d24;--red-light:rgba(200,16,46,.07);
  --blue:#003DA5;--blue2:#002d7a;--blue-light:rgba(0,61,165,.07);
  --navy:#003DA5;--gold:#d4980a;--green:#1a7f37;--green-light:rgba(26,127,55,.07);
  --orange:#d4600a;--purple:#7c3aed;--amber:#d4980a;
  --text:#0f1923;--text2:#3d4d5c;--ink2:#3d4d5c;--ink3:#7a8fa6;--muted:#7a8fa6;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.1),0 12px 40px rgba(0,0,0,.07);
  --card-radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:13px}
.shell,.main{max-width:1500px;margin:0 auto;padding:20px}
/* Page header */
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.page-sub{font-size:12px;color:var(--ink3);margin-top:3px}
/* Cards */
.card{background:#fff;border-radius:var(--card-radius);border:1px solid var(--border);padding:16px;box-shadow:var(--shadow)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3)}
.card-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:12px}
/* KPI cards */
.kpi-card,.kpi{background:#fff;border-radius:var(--card-radius);border:1px solid var(--border);padding:14px 16px;box-shadow:var(--shadow)}
.kpi-val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700}
.kpi-label,.kpi-sub{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-top:3px}
/* Tables */
.ac-table{width:100%;border-collapse:collapse;font-size:12px}
.ac-table th{padding:9px 12px;text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);font-weight:700;border-bottom:2px solid var(--border);background:var(--bg3);white-space:nowrap}
.ac-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--ink2);font-size:12px}
.ac-table tr:last-child td{border-bottom:none}
.ac-table tbody tr:hover td{background:var(--blue-light)}
/* Buttons */
.btn,.tb-btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:all .15s;font-family:'IBM Plex Sans',sans-serif}
.btn-red,.btn-primary{background:var(--red);color:#fff}.btn-red:hover,.btn-primary:hover{background:var(--red2)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue2)}
.btn-ghost{background:#fff;color:var(--ink2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3)}
.btn-green{background:var(--green);color:#fff}
/* Forms */
.form-label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:4px}
.form-input,.form-control,.field-input{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:#fff;transition:border-color .15s}
.form-input:focus,.form-control:focus,.field-input:focus{outline:none;border-color:var(--blue)}
.form-textarea{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:#fff;min-height:70px;resize:vertical}
.form-textarea:focus{outline:none;border-color:var(--blue)}
.form-row{margin-bottom:12px}
/* Modals */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.2)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff}
.modal-title{font-size:14px;font-weight:800;color:var(--text)}
.modal-close{background:none;border:none;font-size:16px;cursor:pointer;color:var(--ink3)}
.modal-body{padding:16px 18px}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}
/* Tabs */
.tabs,.filter-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.tab-btn,.ftab{padding:5px 12px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink3);transition:all .15s;white-space:nowrap}
.tab-btn.active,.ftab.active,.tab-btn:hover,.ftab:hover{background:var(--red);color:#fff;border-color:var(--red)}
/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--ink3)}
.empty-state i{font-size:28px;opacity:.2;display:block;margin-bottom:10px}
/* Toast */
.ce-toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;color:#fff;border-radius:8px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.2);max-width:320px;line-height:1.4}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
/* Search/filter bar */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-box{padding:7px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:#fff;min-width:180px}
.search-box:focus{outline:none;border-color:var(--blue)}
.sel-filter{padding:7px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:'IBM Plex Sans',sans-serif;color:var(--ink2);background:#fff}



*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--ink)}

.nav-link:hover{background:var(--bg);color:var(--ink)}
.nav-link.active{background:var(--red);color:#fff}

.nav-right{margin-left:auto;flex-shrink:0}
.nav-user{font-size:12px;font-weight:600;color:var(--ink3);background:var(--bg);padding:5px 10px;border-radius:20px;border:1px solid var(--border)}
.shell{margin-top:54px;height:calc(100vh - 54px);overflow-y:auto;padding:20px}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--ink3);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.tab-btn.active,.tab-btn:hover{background:var(--red);color:#fff;border-color:var(--red)}
.tab-count{background:rgba(255,255,255,.25);padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:all .15s}
.alert-card:hover{border-color:var(--red);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.alert-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.alert-content{flex:1}
.alert-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px}
.alert-desc{font-size:12px;color:var(--ink3);line-height:1.4}
.alert-meta{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.alert-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase}

/* ── NOTIFICATION BELL ── */
.nav-bell{position:relative;cursor:pointer;padding:6px 8px;border-radius:6px;color:var(--ink3);font-size:14px;transition:all .15s;flex-shrink:0}
.nav-bell:hover{background:#f0f2f6;color:var(--text)}
.bell-badge{position:absolute;top:2px;right:2px;background:#C8102E;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:"IBM Plex Mono",monospace}
/* ── NOTIFICATION PANEL ── */
.notif-overlay{display:none;position:fixed;inset:0;z-index:200}
.notif-overlay.open{display:block}
.notif-panel{position:fixed;top:52px;right:12px;width:340px;max-height:500px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:201;display:flex;flex-direction:column;transform:translateY(-8px);opacity:0;pointer-events:none;transition:all .2s}
.notif-panel.open{transform:translateY(0);opacity:1;pointer-events:all}
.notif-hdr{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.notif-title{font-size:13px;font-weight:800;color:var(--text);flex:1}
.notif-list{overflow-y:auto;flex:1}
.notif-item{padding:12px 16px;border-bottom:1px solid #f0f2f6;cursor:pointer;transition:background .15s}
.notif-item:hover{background:#f8f9fc}
.notif-item.unread{background:#f0f4ff}
.notif-item.unread:hover{background:#e8eeff}
.notif-item-hdr{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.notif-reg{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;background:#f5c518;color:#000;padding:1px 6px;border-radius:3px}
.notif-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:1px 6px;border-radius:3px}
.notif-type.handover{background:#dbeafe;color:#1d4ed8}
.notif-type.urgent{background:#fee2e2;color:#991b1b}
.notif-type.skip{background:#fef9c3;color:#854d0e}
.notif-type.sendback{background:#f3e8ff;color:#6b21a8}
.notif-body{font-size:12px;color:var(--ink2);line-height:1.4}
.notif-meta{font-size:10px;color:var(--ink3);margin-top:3px}
.notif-empty{padding:32px;text-align:center;color:var(--ink3);font-size:13px}
.notif-empty i{display:block;font-size:24px;margin-bottom:8px;opacity:.3}

</style>

<script>

document.getElementById('nav-user').textContent = getCurrentUser().name;

const ALERT_TYPES = [
  {id:'all',label:'All',color:'#64748b',icon:'fas fa-bell'},
  {id:'overdue',label:'Overdue',color:'#ef4444',icon:'fas fa-clock'},
  {id:'mot',label:'MOT',color:'#f59e0b',icon:'fas fa-calendar-xmark'},
  {id:'no-price',label:'No Price',color:'#f97316',icon:'fas fa-tag'},
  {id:'not-advertised',label:'Not Advertised',color:'#8b5cf6',icon:'fas fa-ad'},
  {id:'urgent',label:'Urgent',color:'#C8102E',icon:'fas fa-fire'},
  {id:'off-site',label:'Off-Site',color:'#3b82f6',icon:'fas fa-truck'},
  {id:'activity',label:'Today Activity',color:'#10b981',icon:'fas fa-check'},
];

let allAlerts = [];

function buildAlerts() {
  allAlerts = [];
  AC_VEHICLES.forEach(v => {
    const days = getDaysInStage(v.stageStarted);
    if (isOverdue(v)) allAlerts.push({type:'overdue',reg:v.registration,title:`${v.registration} — Overdue in ${v.workflowStage}`,desc:`${days} days in stage. Auto-escalated to Keith Hardy.`,color:'#ef4444',icon:'fas fa-clock',link:`vehicle-overview.html?reg=${v.registration}`});
    if (v.urgent) allAlerts.push({type:'urgent',reg:v.registration,title:`${v.registration} — URGENT`,desc:`${v.make} ${v.model} flagged as urgent`,color:'#C8102E',icon:'fas fa-fire',link:`vehicle-overview.html?reg=${v.registration}`});
    const mot = getMOTDaysLeft(v.mot);
    if (mot <= 180 && mot > 0 && v.status !== 'Sold') allAlerts.push({type:'mot',reg:v.registration,title:`${v.registration} — MOT expires in ${mot} days`,desc:`${v.make} ${v.model} · MOT: ${v.mot}. Sorted by soonest date.`,color:mot<=60?'#ef4444':'#f59e0b',icon:'fas fa-calendar-xmark',link:`vehicle-overview.html?reg=${v.registration}`});
    if ((!v.price||v.price===0) && v.status==='In Stock') allAlerts.push({type:'no-price',reg:v.registration,title:`${v.registration} — No Price Set`,desc:`${v.make} ${v.model} is In Stock with no retail price.`,color:'#f97316',icon:'fas fa-tag',link:`inventory.html`});
    if (v.workflowStage==='Ready for Sale' && !v.advertised) allAlerts.push({type:'not-advertised',reg:v.registration,title:`${v.registration} — Ready but Not Advertised`,desc:`${v.make} ${v.model} is Ready for Sale but not yet live online.`,color:'#8b5cf6',icon:'fas fa-ad',link:`workflow.html`});
    if (v.status==='Off-site') allAlerts.push({type:'off-site',reg:v.registration,title:`${v.registration} — Off-site`,desc:`${v.make} ${v.model} is currently off-site. Days away: ${days}.`,color:'#3b82f6',icon:'fas fa-truck',link:`vehicle-overview.html?reg=${v.registration}`});
  });

  // MOT sorted by soonest
  const motAlerts = allAlerts.filter(a=>a.type==='mot');
  motAlerts.sort((a,b)=>getMOTDaysLeft(AC_VEHICLES.find(v=>v.registration===a.reg)?.mot||'') - getMOTDaysLeft(AC_VEHICLES.find(v=>v.registration===b.reg)?.mot||''));

  renderTabs();
  renderAlerts('all');
}

let activeType = 'all';
function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = ALERT_TYPES.map(t => {
    const count = t.id==='all' ? allAlerts.length : allAlerts.filter(a=>a.type===t.id).length;
    return `<button class="tab-btn${activeType===t.id?' active':''}" onclick="renderAlerts('${t.id}')" style="${activeType===t.id?'background:'+t.color+';border-color:'+t.color:''}">
      <i class="${t.icon}"></i>${t.label}<span class="tab-count">${count}</span>
    </button>`;
  }).join('');
}

function renderAlerts(type) {
  activeType = type;
  renderTabs();
  const filtered = type==='all' ? allAlerts : allAlerts.filter(a=>a.type===type);
  const el = document.getElementById('alert-list');
  if (!filtered.length) { el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--ink3)"><i class="fas fa-check-circle" style="font-size:32px;color:#10b981;margin-bottom:8px;display:block"></i>No ${type==='all'?'':type} alerts</div>`; return; }
  el.innerHTML = filtered.map(a=>`
    <div class="alert-card" onclick="location.href='${a.link||'#'}'">
      <div class="alert-icon" style="background:${a.color}20"><i class="${a.icon}" style="color:${a.color}"></i></div>
      <div class="alert-content">
        <div class="alert-title">${a.title}</div>
        <div class="alert-desc">${a.desc}</div>
        <div class="alert-meta"><span class="alert-tag" style="background:${a.color}20;color:${a.color}">${a.type.replace('-',' ').toUpperCase()}</span></div>
      </div>
      <i class="fas fa-chevron-right" style="color:var(--ink3);margin-top:2px;flex-shrink:0"></i>
    </div>`).join('');
}

document.addEventListener("DOMContentLoaded", function() {
buildAlerts();
});

</script>
<script>
// Last import badge
(function(){
  try {
    var ts = Math.max(
      parseInt(localStorage.getItem('ce_last_import_stock')||'0'),
      parseInt(localStorage.getItem('ce_last_import_etrack')||'0')
    );
    var el = document.getElementById('lastImportBadge');
    if (!el) return;
    if (!ts) { el.textContent = 'No import yet'; return; }
    var ago = Math.floor((Date.now()-ts)/3600000);
    el.textContent = ago < 1 ? 'Imported < 1hr ago' : ago < 24 ? 'Imported '+ago+'hr ago' : 'Imported '+Math.floor(ago/24)+'d ago';
    el.className = 'nav-import ' + (ago < 24 ? 'fresh' : 'stale');
  } catch(e) {}
})();
</script>

</div>
<script>
// ── NAV BELL ──────────────────────────────────────────────────────
function updateBell() {
  var count = getUnreadCount();
  var badge = document.getElementById('bellBadge');
  if (!badge) return;
  if (count > 0) {
    badge.style.display = 'flex';
    badge.textContent = count > 9 ? '9+' : count;
  } else {
    badge.style.display = 'none';
  }
}

function openNotifPanel() {
  document.getElementById('notifPanel').classList.add('open');
  document.getElementById('notifOverlay').classList.add('open');
  renderNotifPanel();
  markAllRead();
  setTimeout(updateBell, 300);
}

function closeNotifPanel() {
  document.getElementById('notifPanel').classList.remove('open');
  document.getElementById('notifOverlay').classList.remove('open');
}

function renderNotifPanel() {
  var notifs = getMyNotifications();
  var list = document.getElementById('notifList');
  if (!notifs.length) {
    list.innerHTML = '<div class="notif-empty"><i class="fas fa-bell-slash"></i>No notifications yet</div>';
    return;
  }
  list.innerHTML = notifs.slice(0, 30).map(function(n) {
    var ago = timeAgo(n.ts);
    var typeLabel = { handover:'Handover', urgent:'Urgent', skip:'Skipped', sendback:'Sent Back', fault:'Fault' }[n.type] || n.type;
    return '<div class="notif-item' + (n.read ? '' : ' unread') + '" onclick="window.location.href=\'' + (n.link||'workflow.html') + '\'">' +
      '<div class="notif-item-hdr">' +
      '<span class="notif-reg">' + n.reg + '</span>' +
      '<span class="notif-type ' + n.type + '">' + typeLabel + '</span>' +
      '</div>' +
      '<div class="notif-body">' + n.vehicle + ' — ' + n.stage + (n.fromName ? ' · from ' + n.fromName : '') + '</div>' +
      (n.note ? '<div class="notif-meta">"' + n.note.slice(0,60) + (n.note.length>60?'…':'') + '"</div>' : '') +
      '<div class="notif-meta">' + ago + '</div>' +
      '</div>';
  }).join('');
}

function timeAgo(ts) {
  var diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'hr ago';
  return Math.floor(diff/86400) + 'd ago';
}

// Poll for new notifications every 60s
setInterval(updateBell, 60000);
document.addEventListener('DOMContentLoaded', function() { setTimeout(updateBell, 1000); });
</script>
</body>
</html>
