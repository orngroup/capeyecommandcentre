<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | CapEye Auto Capital</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="ac-data.js"></script>
<style>
:root{--red:#C8102E;--blue:#003DA5;--bg:#f0f2f6;--border:#e2e6ed;--text:#0f1923;--ink3:#7a8fa6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:400px}
.logo-area{text-align:center;margin-bottom:32px}
.logo-area img{height:52px;width:auto;margin-bottom:16px;display:block;margin-left:auto;margin-right:auto}
.brand{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;letter-spacing:4px;color:var(--blue)}
.brand span{color:var(--red)}
.brand-sub{font-size:11px;color:var(--ink3);margin-top:6px;letter-spacing:2px;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.card-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px}
.card-sub{font-size:12px;color:var(--ink3);margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);outline:none;transition:border-color .2s;background:#fff}
.field input:focus{border-color:var(--blue)}
.field input::placeholder{color:#b0bec5}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:42px}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink3);font-size:14px;padding:4px}
.btn-login{width:100%;padding:13px;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .2s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-login:hover{background:#002d7a}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.error-msg{background:#fff0f0;border:1px solid #ffcdd2;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;display:none;align-items:center;gap:8px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.footer-note{text-align:center;font-size:11px;color:var(--ink3);margin-top:20px}
.hint-note{background:#e8f0fe;border:1px solid #c5d8fb;border-radius:8px;padding:12px 14px;font-size:12px;color:#1a3a7a;margin-top:16px;line-height:1.6;display:none}
.hint-note strong{display:block;margin-bottom:4px}
code{background:#dce8fd;padding:2px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-area">
    <img src="auto-capital-logo.png" alt="Auto Capital" onerror="this.style.display='none'">
    <div class="brand">Cap<span>Eye</span></div>
    <div class="brand-sub">Auto Capital Command Centre</div>
  </div>
  <div class="card">
    <div class="card-title">Sign In</div>
    <div class="card-sub">Use your Auto Capital work email</div>
    <div class="error-msg" id="errorMsg"><i class="fas fa-exclamation-circle"></i><span id="errorText"></span></div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="name@autocapital.co.uk" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('passInput').focus()">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="passInput" placeholder="Your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="pw-toggle" onclick="togglePw()" tabindex="-1"><i class="fas fa-eye" id="pwIcon"></i></button>
      </div>
    </div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <i class="fas fa-sign-in-alt"></i> Sign In
    </button>
    <div class="hint-note" id="hintNote">
      <strong>First time signing in?</strong>
      Your temporary password is your first name followed by <code>ac</code> — for example <code>keithac</code> or <code>germainac</code>.
    </div>
  </div>
  <div class="footer-note">CapEye Auto Capital &middot; <a href="https://capeye.autocapital.co.uk" style="color:var(--blue);text-decoration:none">capeye.autocapital.co.uk</a></div>
</div>
<script>
var auth;
try { firebase.app(); auth = firebase.auth(); } catch(e) {}

// Already logged in?
if (auth) {
  auth.onAuthStateChanged(function(u) {
    if (u) {
      setSession(u.email);
      window.location.href = 'index.html';
    }
  });
}

function setSession(email) {
  var s = AC_STAFF.find(function(x){ return x.email && x.email.toLowerCase() === email.toLowerCase(); });
  if (s) {
    localStorage.setItem('ce_user_id', s.id);
    localStorage.setItem('ce_user_name', s.name);
    localStorage.setItem('ce_user_dept', s.dept);
    localStorage.setItem('ce_user_admin', s.admin ? '1' : '0');
    localStorage.setItem('ce_user_price', s.canSeePurchasePrice ? '1' : '0');
    localStorage.setItem('ce_user_mgr', (s.canSkipStages || s.canSendBack) ? '1' : '0');
  } else {
    var name = email.split('@')[0];
    localStorage.setItem('ce_user_id', 'unknown');
    localStorage.setItem('ce_user_name', name.charAt(0).toUpperCase()+name.slice(1));
    localStorage.setItem('ce_user_dept', 'Management');
    localStorage.setItem('ce_user_admin', '1');
    localStorage.setItem('ce_user_price', '1');
    localStorage.setItem('ce_user_mgr', '1');
  }
  localStorage.setItem('ce_user_email', email);
  localStorage.setItem('ce_auth_ts', Date.now().toString());
}

function togglePw() {
  var i = document.getElementById('passInput');
  var ic = document.getElementById('pwIcon');
  i.type = i.type === 'password' ? 'text' : 'password';
  ic.className = i.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}

function showErr(msg) {
  var el = document.getElementById('errorMsg');
  document.getElementById('errorText').textContent = msg;
  el.style.display = 'flex';
}

function doLogin() {
  var email = document.getElementById('emailInput').value.trim();
  var pass  = document.getElementById('passInput').value;
  var btn   = document.getElementById('loginBtn');
  document.getElementById('errorMsg').style.display = 'none';
  if (!email) { showErr('Please enter your email address'); return; }
  if (!pass)  { showErr('Please enter your password'); return; }
  if (!auth)  { showErr('System not configured — contact your administrator'); return; }
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Signing in...';
  auth.signInWithEmailAndPassword(email, pass)
    .then(function(r) {
      setSession(r.user.email);
      window.location.href = 'index.html';
    })
    .catch(function(e) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      document.getElementById('hintNote').style.display = 'block';
      if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-email') {
        showErr('No account found for that email address');
      } else if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
        showErr('Incorrect password. Hint: first name + ac (e.g. keithac)');
      } else if (e.code === 'auth/too-many-requests') {
        showErr('Too many attempts — please wait a few minutes');
      } else {
        showErr(e.message);
      }
    });
}

setTimeout(function(){ document.getElementById('hintNote').style.display = 'block'; }, 4000);
</script>
</body>
</html>
