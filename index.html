<style>

/* ── SHARED BASE STYLES ── */
:root{
  --bg:#f4f6f9;--bg2:#fff;--bg3:#f0f2f6;--bg4:#eef0f5;
  --border:#e2e6ed;--border2:#c8d0dc;
  --red:#C8102E;--red2:#a00d24;--red-light:rgba(200,16,46,.07);
  --blue:#003DA5;--blue2:#002d7a;--blue-light:rgba(0,61,165,.07);
  --navy:#003DA5;--gold:#d4980a;--green:#1a7f37;--green-light:rgba(26,127,55,.07);
  --orange:#d4600a;--purple:#7c3aed;--amber:#d4980a;
  --text:#0f1923;--text2:#3d4d5c;--ink2:#3d4d5c;--ink3:#7a8fa6;--muted:#7a8fa6;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.1),0 12px 40px rgba(0,0,0,.07);
  --card-radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:13px}
.shell,.main{max-width:1500px;margin:0 auto;padding:20px}
/* Page header */
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.page-sub{font-size:12px;color:var(--ink3);margin-top:3px}
/* Cards */
.card{background:#fff;border-radius:var(--card-radius);border:1px solid var(--border);padding:16px;box-shadow:var(--shadow)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3)}
.card-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:12px}
/* KPI cards */
.kpi-card,.kpi{background:#fff;border-radius:var(--card-radius);border:1px solid var(--border);padding:14px 16px;box-shadow:var(--shadow)}
.kpi-val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700}
.kpi-label,.kpi-sub{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-top:3px}
/* Tables */
.ac-table{width:100%;border-collapse:collapse;font-size:12px}
.ac-table th{padding:9px 12px;text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);font-weight:700;border-bottom:2px solid var(--border);background:var(--bg3);white-space:nowrap}
.ac-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--ink2);font-size:12px}
.ac-table tr:last-child td{border-bottom:none}
.ac-table tbody tr:hover td{background:var(--blue-light)}
/* Buttons */
.btn,.tb-btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:all .15s;font-family:'IBM Plex Sans',sans-serif}
.btn-red,.btn-primary{background:var(--red);color:#fff}.btn-red:hover,.btn-primary:hover{background:var(--red2)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue2)}
.btn-ghost{background:#fff;color:var(--ink2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3)}
.btn-green{background:var(--green);color:#fff}
/* Forms */
.form-label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:4px}
.form-input,.form-control,.field-input{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:#fff;transition:border-color .15s}
.form-input:focus,.form-control:focus,.field-input:focus{outline:none;border-color:var(--blue)}
.form-textarea{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:#fff;min-height:70px;resize:vertical}
.form-textarea:focus{outline:none;border-color:var(--blue)}
.form-row{margin-bottom:12px}
/* Modals */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.2)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff}
.modal-title{font-size:14px;font-weight:800;color:var(--text)}
.modal-close{background:none;border:none;font-size:16px;cursor:pointer;color:var(--ink3)}
.modal-body{padding:16px 18px}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}
/* Tabs */
.tabs,.filter-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.tab-btn,.ftab{padding:5px 12px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink3);transition:all .15s;white-space:nowrap}
.tab-btn.active,.ftab.active,.tab-btn:hover,.ftab:hover{background:var(--red);color:#fff;border-color:var(--red)}
/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--ink3)}
.empty-state i{font-size:28px;opacity:.2;display:block;margin-bottom:10px}
/* Toast */
.ce-toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;color:#fff;border-radius:8px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.2);max-width:320px;line-height:1.4}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
/* Search/filter bar */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-box{padding:7px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:#fff;min-width:180px}
.search-box:focus{outline:none;border-color:var(--blue)}
.sel-filter{padding:7px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:'IBM Plex Sans',sans-serif;color:var(--ink2);background:#fff}



*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--ink)}
/* NAV */
.nav{position:fixed;top:0;left:0;right:0;height:54px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.nav-brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.nav-mark{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:2px;text-transform:uppercase}
.nav-name{font-size:14px;font-weight:700;color:var(--ink)}
.nav-div{width:1px;height:20px;background:var(--border);flex-shrink:0}
.nav-links{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink3);text-decoration:none;white-space:nowrap;transition:all .15s}
.nav-link:hover{background:var(--bg);color:var(--ink)}
.nav-link.active{background:var(--red);color:#fff}
.nav-link i{font-size:11px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-user{font-size:12px;font-weight:600;color:var(--ink3);background:var(--bg);padding:5px 10px;border-radius:20px;border:1px solid var(--border)}
/* SHELL */
.shell{margin-top:54px;height:calc(100vh - 54px);overflow-y:auto;padding:20px}
/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.kpi:hover{border-color:var(--red);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.kpi-v{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--ink);line-height:1}
.kpi-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);margin-top:4px}
.kpi-dot{width:6px;height:6px;border-radius:50%;margin-top:6px}
/* GRID */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border-radius:12px;border:1px solid var(--border);padding:16px}
.card-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink3);margin-bottom:14px;display:flex;align-items:center;gap:8px}
/* TODAY VIEW */
.today-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.today-item:last-child{border-bottom:none}
.today-reg{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--ink);background:var(--bg);padding:2px 7px;border-radius:4px;flex-shrink:0}
.today-stage{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;color:#fff;flex-shrink:0}
.today-who{font-size:11px;color:var(--ink3);margin-left:auto;flex-shrink:0}
.today-days{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0}
.days-ok{background:#d1fae5;color:#065f46}
.days-warn{background:#fef3c7;color:#92400e}
.days-over{background:#fee2e2;color:#991b1b}
/* STAGE PIPELINE */
.pipeline{display:flex;flex-direction:column;gap:6px}
.pipe-row{display:flex;align-items:center;gap:8px}
.pipe-name{font-size:11px;font-weight:600;color:var(--ink2);width:110px;flex-shrink:0}
.pipe-bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.pipe-fill{height:100%;border-radius:4px;transition:width .4s ease}
.pipe-count{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--ink3);width:24px;text-align:right;flex-shrink:0}
/* EMPLOYEE CHART */
.emp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.emp-name{font-size:11px;font-weight:600;color:var(--ink2);width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp-bar{flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
.emp-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:700;color:#fff;min-width:20px;transition:width .4s ease}
/* ALERTS MINI */
.alert-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--bg)}
.alert-item:last-child{border-bottom:none}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.alert-text{font-size:11px;color:var(--ink2);line-height:1.4}
.alert-tag{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--ink3);margin-top:2px}
/* URGENT BADGE */
.urgent-badge{background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px}
/* FULL WIDTH */
.full{grid-column:1/-1}
/* SCROLLABLE */
.scroll-list{max-height:280px;overflow-y:auto}
.scroll-list::-webkit-scrollbar{width:4px}
.scroll-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── NOTIFICATION BELL ── */
.nav-bell{position:relative;cursor:pointer;padding:6px 8px;border-radius:6px;color:var(--ink3);font-size:14px;transition:all .15s;flex-shrink:0}
.nav-bell:hover{background:#f0f2f6;color:var(--text)}
.bell-badge{position:absolute;top:2px;right:2px;background:#C8102E;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:"IBM Plex Mono",monospace}
/* ── NOTIFICATION PANEL ── */
.notif-overlay{display:none;position:fixed;inset:0;z-index:200}
.notif-overlay.open{display:block}
.notif-panel{position:fixed;top:52px;right:12px;width:340px;max-height:500px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:201;display:flex;flex-direction:column;transform:translateY(-8px);opacity:0;pointer-events:none;transition:all .2s}
.notif-panel.open{transform:translateY(0);opacity:1;pointer-events:all}
.notif-hdr{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.notif-title{font-size:13px;font-weight:800;color:var(--text);flex:1}
.notif-list{overflow-y:auto;flex:1}
.notif-item{padding:12px 16px;border-bottom:1px solid #f0f2f6;cursor:pointer;transition:background .15s}
.notif-item:hover{background:#f8f9fc}
.notif-item.unread{background:#f0f4ff}
.notif-item.unread:hover{background:#e8eeff}
.notif-item-hdr{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.notif-reg{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;background:#f5c518;color:#000;padding:1px 6px;border-radius:3px}
.notif-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:1px 6px;border-radius:3px}
.notif-type.handover{background:#dbeafe;color:#1d4ed8}
.notif-type.urgent{background:#fee2e2;color:#991b1b}
.notif-type.skip{background:#fef9c3;color:#854d0e}
.notif-type.sendback{background:#f3e8ff;color:#6b21a8}
.notif-body{font-size:12px;color:var(--ink2);line-height:1.4}
.notif-meta{font-size:10px;color:var(--ink3);margin-top:3px}
.notif-empty{padding:32px;text-align:center;color:var(--ink3);font-size:13px}
.notif-empty i{display:block;font-size:24px;margin-bottom:8px;opacity:.3}

</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function() {
// ── KPIs
function buildKPIs() {
  const v = AC_VEHICLES;
  const inStock  = v.filter(x => x.status==='In Stock').length;
  const sold     = v.filter(x => x.status==='Sold').length;
  const offSite  = v.filter(x => x.status==='Off-site').length;
  const ready    = v.filter(x => x.workflowStage==='Ready for Sale').length;
  const adv      = v.filter(x => x.workflowStage==='Advertising').length;
  const afters   = v.filter(x => x.workflowStage==='Aftersales').length;
  const overdue  = v.filter(x => isOverdue(x)).length;
  const urgent   = v.filter(x => x.urgent).length;
  const noPrice  = v.filter(x => (!x.price || x.price===0) && x.status==='In Stock').length;

  const kpis = [
    {v:inStock,  l:'In Stock',      color:'#3b82f6'},
    {v:ready,    l:'Ready',         color:'#0891b2'},
    {v:adv,      l:'Advertised',    color:'#8b5cf6'},
    {v:sold,     l:'Sold',          color:'#64748b'},
    {v:offSite,  l:'Off-Site',      color:'#f97316'},
    {v:afters,   l:'Aftersales',    color:'#f43f5e'},
    {v:overdue,  l:'Overdue >3d',   color:'#ef4444'},
    {v:urgent,   l:'Urgent',        color:'#C8102E'},
    {v:noPrice,  l:'No Price',      color:'#f59e0b'},
    {v:AC_AUCTION_VEHICLES.filter(x=>x.status!=='Sold at Auction').length, l:'Auction', color:'#a855f7'},
  ];
  const row = document.getElementById('kpi-row');
  row.innerHTML = kpis.map(k => `
    <div class="kpi" style="border-top:3px solid ${k.color}">
      <div class="kpi-v" style="color:${k.color}">${k.v}</div>
      <div class="kpi-l">${k.l}</div>
    </div>`).join('');
}

// ── Today view
function buildToday() {
  const list = document.getElementById('today-list');
  const active = AC_VEHICLES.filter(v =>
    !['Sold','Aftersales'].includes(v.workflowStage) && v.status !== 'Sold'
  ).sort((a,b) => (b.urgent?1:0)-(a.urgent?1:0) || getDaysInStage(b.stageStarted)-getDaysInStage(a.stageStarted));

  list.innerHTML = active.map(v => {
    const days = getDaysInStage(v.stageStarted);
    const cls = days<=1?'days-ok':days<=3?'days-warn':'days-over';
    const stage = AC_WORKFLOW_STAGES.find(s=>s.name===v.workflowStage);
    const color = stage ? stage.color : '#64748b';
    return `<div class="today-item" onclick="location.href='vehicle-overview.html?reg=${v.registration}'">
      ${v.urgent?'<span class="urgent-badge">URGENT</span>':''}
      <span class="today-reg">${v.registration}</span>
      <span class="today-stage" style="background:${color}">${v.workflowStage}</span>
      <span class="today-who">${stage?stage.assignedTo:'—'}</span>
      <span class="today-days ${cls}">${days}d</span>
    </div>`;
  }).join('');
}

// ── Pipeline
function buildPipeline() {
  const counts = {};
  AC_VEHICLES.forEach(v => { counts[v.workflowStage] = (counts[v.workflowStage]||0)+1; });
  const max = Math.max(...Object.values(counts), 1);
  const el = document.getElementById('pipeline');
  el.innerHTML = AC_WORKFLOW_STAGES.map(s => {
    const c = counts[s.name]||0;
    const w = c ? Math.max((c/max)*100,8) : 0;
    return `<div class="pipe-row">
      <span class="pipe-name">${s.name}</span>
      <div class="pipe-bar"><div class="pipe-fill" style="width:${w}%;background:${s.color}"></div></div>
      <span class="pipe-count">${c}</span>
    </div>`;
  }).join('');
}

// ── Employee workload
function buildEmployeeChart() {
  const jobs = {};
  AC_VEHICLES.forEach(v => {
    const stage = AC_WORKFLOW_STAGES.find(s=>s.name===v.workflowStage);
    if (!stage || ['Sold','Ready for Sale'].includes(v.workflowStage)) return;
    const key = stage.assignedTo;
    jobs[key] = (jobs[key]||0)+1;
  });
  const sorted = Object.entries(jobs).sort((a,b)=>b[1]-a[1]);
  const max = sorted.length ? sorted[0][1] : 1;
  const el = document.getElementById('emp-chart');
  el.innerHTML = sorted.map(([name,count]) => {
    const w = Math.max((count/max)*100,12);
    return `<div class="emp-row">
      <span class="emp-name">${name}</span>
      <div class="emp-bar">
        <div class="emp-fill" style="width:${w}%;background:var(--navy)">${count}</div>
      </div>
    </div>`;
  }).join('') || '<div style="color:var(--ink3);font-size:12px">No active jobs</div>';
}

// ── Alerts mini
function buildAlerts() {
  const el = document.getElementById('alerts-mini');
  const alerts = [];

  AC_VEHICLES.forEach(v => {
    const days = getDaysInStage(v.stageStarted);
    if (isOverdue(v)) alerts.push({color:'#ef4444',text:`${v.registration} — ${v.workflowStage} for ${days} days`,tag:'Overdue'});
    if (v.urgent) alerts.push({color:'#C8102E',text:`${v.registration} — Marked URGENT`,tag:'Urgent'});
    const mot = getMOTDaysLeft(v.mot);
    if (mot <= 180 && mot > 0) alerts.push({color:'#f59e0b',text:`${v.registration} — MOT expires in ${mot} days (${v.mot})`,tag:'MOT'});
    if ((!v.price||v.price===0) && v.status==='In Stock') alerts.push({color:'#f97316',text:`${v.registration} — No price set`,tag:'No Price'});
    if (v.workflowStage==='Ready for Sale' && !v.advertised) alerts.push({color:'#8b5cf6',text:`${v.registration} — Ready but not advertised`,tag:'Not Advertised'});
  });

  if (!alerts.length) {
    el.innerHTML = '<div style="color:var(--green);font-size:12px;font-weight:600">✓ No active alerts</div>';
    return;
  }
  el.innerHTML = alerts.slice(0,10).map(a => `
    <div class="alert-item">
      <div class="alert-dot" style="background:${a.color}"></div>
      <div><div class="alert-text">${a.text}</div><div class="alert-tag">${a.tag}</div></div>
    </div>`).join('');
}

// ── Init
document.getElementById('nav-user').textContent = getCurrentUser().name;
buildKPIs();
buildToday();
buildPipeline();
buildEmployeeChart();
buildAlerts();
});
</script>

    );
    var el = document.getElementById('lastImportBadge');
    if (!el) return;
    if (!ts) { el.textContent = 'No import yet'; return; }

  } catch(e) {}

<!-- NOTIFICATION PANEL -->
<div class="notif-overlay" id="notifOverlay" onclick="closeNotifPanel()"></div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-hdr">
    <span class="notif-title"><i class="fas fa-bell"></i> Notifications</span>
    <button onclick="markAllRead();renderNotifPanel()" style="background:none;border:none;font-size:11px;color:var(--ink3);cursor:pointer;font-family:inherit;font-weight:600">Mark all read</button>
    <button onclick="closeNotifPanel()" style="background:none;border:none;font-size:16px;cursor:pointer;color:var(--ink3);padding:2px 6px">&times;</button>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>
<script>
// ── NAV BELL ──────────────────────────────────────────────────────
function updateBell() {
  var count = getUnreadCount();
  var badge = document.getElementById('bellBadge');
  if (!badge) return;
  if (count > 0) {
    badge.style.display = 'flex';
    badge.textContent = count > 9 ? '9+' : count;
  } else {
    badge.style.display = 'none';
  }
}

function openNotifPanel() {
  document.getElementById('notifPanel').classList.add('open');
  document.getElementById('notifOverlay').classList.add('open');
  renderNotifPanel();
  markAllRead();
  setTimeout(updateBell, 300);
}

function closeNotifPanel() {
  document.getElementById('notifPanel').classList.remove('open');
  document.getElementById('notifOverlay').classList.remove('open');
}

function renderNotifPanel() {
  var notifs = getMyNotifications();
  var list = document.getElementById('notifList');
  if (!notifs.length) {
    list.innerHTML = '<div class="notif-empty"><i class="fas fa-bell-slash"></i>No notifications yet</div>';
    return;
  }
  list.innerHTML = notifs.slice(0, 30).map(function(n) {
    var ago = timeAgo(n.ts);
    var typeLabel = { handover:'Handover', urgent:'Urgent', skip:'Skipped', sendback:'Sent Back', fault:'Fault' }[n.type] || n.type;
    return '<div class="notif-item' + (n.read ? '' : ' unread') + '" onclick="window.location.href=\'' + (n.link||'workflow.html') + '\'">' +
      '<div class="notif-item-hdr">' +
      '<span class="notif-reg">' + n.reg + '</span>' +
      '<span class="notif-type ' + n.type + '">' + typeLabel + '</span>' +
      '</div>' +
      '<div class="notif-body">' + n.vehicle + ' — ' + n.stage + (n.fromName ? ' · from ' + n.fromName : '') + '</div>' +
      (n.note ? '<div class="notif-meta">"' + n.note.slice(0,60) + (n.note.length>60?'…':'') + '"</div>' : '') +
      '<div class="notif-meta">' + ago + '</div>' +
      '</div>';
  }).join('');
}

function timeAgo(ts) {
  var diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'hr ago';
  return Math.floor(diff/86400) + 'd ago';
}

// Poll for new notifications every 60s
setInterval(updateBell, 60000);
document.addEventListener('DOMContentLoaded', function() { setTimeout(updateBell, 1000); });
</script>
</body>
