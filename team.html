/* ── SHARED BASE STYLES ── */
:root{
  --bg:#f4f6f9;--bg2:#fff;--bg3:#f0f2f6;--bg4:#eef0f5;
  --border:#e2e6ed;--border2:#c8d0dc;
  --red:#C8102E;--red2:#a00d24;--red-light:rgba(200,16,46,.07);
  --blue:#003DA5;--blue2:#002d7a;--blue-light:rgba(0,61,165,.07);
  --navy:#003DA5;--gold:#d4980a;--green:#1a7f37;--green-light:rgba(26,127,55,.07);
  --orange:#d4600a;--purple:#7c3aed;--amber:#d4980a;
  --text:#0f1923;--text2:#3d4d5c;--ink2:#3d4d5c;--ink3:#7a8fa6;--muted:#7a8fa6;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.1),0 12px 40px rgba(0,0,0,.07);
  --card-radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:13px}
.shell,.main{max-width:1500px;margin:0 auto;padding:20px}
/* Page header */
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.page-sub{font-size:12px;color:var(--ink3);margin-top:3px}
/* Cards */
.card{background:#fff;border-radius:var(--card-radius);border:1px solid var(--border);padding:16px;box-shadow:var(--shadow)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3)}
.card-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:12px}
/* KPI cards */
.kpi-card,.kpi{background:#fff;border-radius:var(--card-radius);border:1px solid var(--border);padding:14px 16px;box-shadow:var(--shadow)}
.kpi-val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700}
.kpi-label,.kpi-sub{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-top:3px}
/* Tables */
.ac-table{width:100%;border-collapse:collapse;font-size:12px}
.ac-table th{padding:9px 12px;text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);font-weight:700;border-bottom:2px solid var(--border);background:var(--bg3);white-space:nowrap}
.ac-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--ink2);font-size:12px}
.ac-table tr:last-child td{border-bottom:none}
.ac-table tbody tr:hover td{background:var(--blue-light)}
/* Buttons */
.btn,.tb-btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:all .15s;font-family:'IBM Plex Sans',sans-serif}
.btn-red,.btn-primary{background:var(--red);color:#fff}.btn-red:hover,.btn-primary:hover{background:var(--red2)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue2)}
.btn-ghost{background:#fff;color:var(--ink2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3)}
.btn-green{background:var(--green);color:#fff}
/* Forms */
.form-label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:4px}
.form-input,.form-control,.field-input{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:#fff;transition:border-color .15s}
.form-input:focus,.form-control:focus,.field-input:focus{outline:none;border-color:var(--blue)}
.form-textarea{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:#fff;min-height:70px;resize:vertical}
.form-textarea:focus{outline:none;border-color:var(--blue)}
.form-row{margin-bottom:12px}
/* Modals */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.2)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff}
.modal-title{font-size:14px;font-weight:800;color:var(--text)}
.modal-close{background:none;border:none;font-size:16px;cursor:pointer;color:var(--ink3)}
.modal-body{padding:16px 18px}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}
/* Tabs */
.tabs,.filter-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.tab-btn,.ftab{padding:5px 12px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink3);transition:all .15s;white-space:nowrap}
.tab-btn.active,.ftab.active,.tab-btn:hover,.ftab:hover{background:var(--red);color:#fff;border-color:var(--red)}
/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--ink3)}
.empty-state i{font-size:28px;opacity:.2;display:block;margin-bottom:10px}
/* Toast */
.ce-toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;color:#fff;border-radius:8px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.2);max-width:320px;line-height:1.4}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
/* Search/filter bar */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-box{padding:7px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:#fff;min-width:180px}
.search-box:focus{outline:none;border-color:var(--blue)}
.sel-filter{padding:7px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:'IBM Plex Sans',sans-serif;color:var(--ink2);background:#fff}



*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

.logo-area img{height:40px;width:auto}
.logo-divider{width:1px;height:32px;background:var(--border)}

.user-info{display:flex;align-items:center;gap:10px}

.btn-sm{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Barlow',sans-serif}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn-ghost:hover{color:var(--text)}
.main{max-width:1400px;margin:0 auto;padding:28px}
.page-title{margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.page-title h1{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:1px}
.filters-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.search-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-size:13px;font-family:'Barlow',sans-serif;outline:none;width:240px}
.search-box::placeholder{color:var(--muted)}
.filter-btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--muted);transition:all .2s}
.filter-btn.active{color:var(--text);background:var(--bg3);border-color:rgba(255,255,255,.2)}
/* STAFF GRID */
.team-grid{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.team-card{background:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;cursor:pointer;transition:background .12s}
.team-card:hover{background:var(--blue-light)}
.card-banner{height:80px;position:relative}
.card-avatar{width:72px;height:72px;border-radius:50%;border:3px solid var(--bg2);position:absolute;bottom:-36px;left:20px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.card-avatar img{width:100%;height:100%;object-fit:cover}
.card-body{padding:48px 20px 20px}
.card-name{font-size:18px;font-weight:800;margin-bottom:3px}
.card-role{font-size:13px;color:var(--muted);margin-bottom:10px}
.dept-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.5px;margin-bottom:14px}
.contact-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.contact-row i{width:14px;text-align:center;flex-shrink:0}
.contact-row a{color:var(--muted);text-decoration:none}.contact-row a:hover{color:var(--text)}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.stat-box{text-align:center}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800}
.stat-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
/* PROFILE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;backdrop-filter:blur(6px)}
.modal{background:var(--bg2);border:1px solid rgba(255,255,255,.1);border-radius:20px;width:100%;max-width:680px;animation:popIn .25s ease}
@keyframes popIn{from{transform:scale(.94) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-banner{height:120px;position:relative;border-radius:20px 20px 0 0;overflow:hidden}
.modal-avatar{width:96px;height:96px;border-radius:50%;border:4px solid var(--bg2);position:absolute;bottom:-48px;left:28px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.modal-avatar img{width:100%;height:100%;object-fit:cover}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:64px 28px 28px}
.modal-name{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;letter-spacing:.5px}
.modal-role{font-size:14px;color:var(--muted);margin-top:4px;margin-bottom:14px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.info-field{background:var(--bg3);border-radius:10px;padding:12px 14px}
.info-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.info-val{font-size:14px;font-weight:600}
.task-list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.task-list-item:last-child{border-bottom:none}
.task-done{color:var(--green)}.task-pending{color:var(--orange)}
.loading{text-align:center;padding:60px;color:var(--muted)}

<script>
/* ── TEAM PAGE ── */
const DEPT_COLORS={Management:'#64748b',Sales:'#003DA5',Workshop:'#ef4444',Valeting:'#10b981',Marketing:'#8b5cf6',Finance:'#a855f7',Bodyshop:'#f97316',Intake:'#6366f1'};
let activeDept='all';

function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function avatarColor(n){let h=0;for(let c of n)h=(h*31+c.charCodeAt(0))&0xffffffff;const cols=['#003DA5','#C8102E','#1a7f37','#d4980a','#7c3aed','#0891b2','#be185d','#d4600a'];return cols[Math.abs(h)%cols.length];}

function renderTeam(){
  const q=(document.getElementById('teamSearch').value||'').toLowerCase();
  const list=AC_STAFF.filter(s=>{
    if(activeDept!=='all'&&s.dept!==activeDept)return false;
    if(q&&!`${s.name} ${s.role} ${s.dept}`.toLowerCase().includes(q))return false;
    return true;
  });
  const grid=document.getElementById('teamGrid');
  if(!list.length){grid.innerHTML='<div style="text-align:center;padding:60px;color:var(--muted)"><i class="fas fa-users" style="font-size:32px;opacity:.2;display:block;margin-bottom:12px"></i>No staff found</div>';return;}
  grid.innerHTML=list.map(s=>{
    const col=DEPT_COLORS[s.dept]||'#003DA5';
    const init=initials(s.name);
    return `<div class="team-card" onclick="openProfile('${s.name.replace(/'/g,"\'")}')">
      <div style="width:34px;height:34px;border-radius:50%;background:${col};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0">${init}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:700;color:var(--text)">${s.name}</div>
        <div style="font-size:11px;color:var(--ink3)">${s.role}</div>
      </div>
      <div style="font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px;background:${col}15;color:${col};white-space:nowrap">${s.dept}</div>
      ${s.phone?`<a href="tel:${s.phone}" onclick="event.stopPropagation()" style="font-size:11px;font-weight:600;color:var(--blue);text-decoration:none;white-space:nowrap;margin-left:8px"><i class="fas fa-phone" style="font-size:10px;margin-right:3px"></i>${s.phone}</a>`:''}
    </div>`;
  }).join('');
}

function openProfile(name){
  const s=AC_STAFF.find(x=>x.name===name);if(!s)return;
  const col=DEPT_COLORS[s.dept]||'#003DA5';
  const deptData=AC_DEPARTMENTS.find(d=>d.name===s.dept)||{icon:'👤'};
  const tasks=typeof getTasksForStaff==='function'?getTasksForStaff(s.name):[];
  document.getElementById('profileContent').innerHTML=`
    <div class="modal-banner" style="background:linear-gradient(135deg,${col}33,${col}66)">
      <div class="modal-avatar" style="background:${col}"><span style="color:#fff;font-size:34px;font-weight:800">${initials(s.name)}</span></div>
      <button class="modal-close" onclick="closeProfile()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="modal-name">${s.name}</div>
      <div class="modal-role" style="color:var(--muted);margin-bottom:10px">${s.role}</div>
      <div style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;background:${col}18;color:${col};margin-bottom:16px">${deptData.icon} ${s.dept}</div>
      <div class="info-grid">
        <div class="info-field"><div class="info-label">Department</div><div class="info-val">${s.dept}</div></div>
        <div class="info-field"><div class="info-label">Role</div><div class="info-val">${s.role}</div></div>
        <div class="info-field"><div class="info-label">Phone</div><div class="info-val">${s.phone||'Not set'}</div></div>
        <div class="info-field"><div class="info-label">Email</div><div class="info-val">${s.email||'Not set'}</div></div>
        <div class="info-field"><div class="info-label">Start Date</div><div class="info-val">${s.startDate||'Not set'}</div></div>
        <div class="info-field"><div class="info-label">Emergency Contact</div><div class="info-val">${s.emergency||'Not set'}</div></div>
      </div>
      ${tasks.length?`<div style="margin-top:20px"><div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px">Tasks (${tasks.filter(t=>!t.done).length} pending)</div>
      ${tasks.slice(0,8).map(t=>`<div class="task-list-item"><i class="fas ${t.done?'fa-check-circle task-done':'fa-clock task-pending'}"></i><span>${t.stageName||'Task'}${t.stockNo?' — '+t.stockNo:''}</span><span style="margin-left:auto;font-size:11px">${t.priority==='critical'?'🔴':t.priority==='urgent'?'🟡':''}</span></div>`).join('')}</div>`:
      `<div style="margin-top:20px;padding:16px;background:var(--bg3);border-radius:10px;text-align:center;color:var(--muted);font-size:13px"><i class="fas fa-check-circle" style="color:var(--green);margin-right:8px"></i>No active tasks</div>`}
    </div>`;
  document.getElementById('profileModal').style.display='flex';
}
function closeProfile(){document.getElementById('profileModal').style.display='none';}

function buildDeptFilters(){
  const depts=[...new Set(AC_STAFF.map(s=>s.dept))];
  document.getElementById('deptFilters').innerHTML=
    ['all',...depts].map(d=>`<button class="filter-btn${d===activeDept?' active':''}" onclick="setDept('${d}')">${d==='all'?'All Staff':d} <span style="font-size:10px">${d==='all'?AC_STAFF.length:AC_STAFF.filter(s=>s.dept===d).length}</span></button>`).join('');
}
function setDept(d){activeDept=d;buildDeptFilters();renderTeam();}

buildDeptFilters();
renderTeam();
</script>

    var badge=document.getElementById('lastImportBadge');
    var span=document.getElementById('lastImportTime');

    var age=(Date.now()-ts)/3600000;
    var d=new Date(ts);
    var label=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    span.textContent=label;
    badge.className='last-import '+(age<24?'fresh':age>48?'stale':'');

})();

<!-- NOTIFICATION PANEL -->
<div class="notif-overlay" id="notifOverlay" onclick="closeNotifPanel()"></div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-hdr">
    <span class="notif-title"><i class="fas fa-bell"></i> Notifications</span>
    <button onclick="markAllRead();renderNotifPanel()" style="background:none;border:none;font-size:11px;color:var(--ink3);cursor:pointer;font-family:inherit;font-weight:600">Mark all read</button>
    <button onclick="closeNotifPanel()" style="background:none;border:none;font-size:16px;cursor:pointer;color:var(--ink3);padding:2px 6px">&times;</button>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>
<script>
// ── NAV BELL ──────────────────────────────────────────────────────
function updateBell() {
  var count = getUnreadCount();
  var badge = document.getElementById('bellBadge');
  if (!badge) return;
  if (count > 0) {
    badge.style.display = 'flex';
    badge.textContent = count > 9 ? '9+' : count;
  } else {
    badge.style.display = 'none';
  }
}

function openNotifPanel() {
  document.getElementById('notifPanel').classList.add('open');
  document.getElementById('notifOverlay').classList.add('open');
  renderNotifPanel();
  markAllRead();
  setTimeout(updateBell, 300);
}

function closeNotifPanel() {
  document.getElementById('notifPanel').classList.remove('open');
  document.getElementById('notifOverlay').classList.remove('open');
}

function renderNotifPanel() {
  var notifs = getMyNotifications();
  var list = document.getElementById('notifList');
  if (!notifs.length) {
    list.innerHTML = '<div class="notif-empty"><i class="fas fa-bell-slash"></i>No notifications yet</div>';
    return;
  }
  list.innerHTML = notifs.slice(0, 30).map(function(n) {
    var ago = timeAgo(n.ts);
    var typeLabel = { handover:'Handover', urgent:'Urgent', skip:'Skipped', sendback:'Sent Back', fault:'Fault' }[n.type] || n.type;
    return '<div class="notif-item' + (n.read ? '' : ' unread') + '" onclick="window.location.href=\'' + (n.link||'workflow.html') + '\'">' +
      '<div class="notif-item-hdr">' +
      '<span class="notif-reg">' + n.reg + '</span>' +
      '<span class="notif-type ' + n.type + '">' + typeLabel + '</span>' +
      '</div>' +
      '<div class="notif-body">' + n.vehicle + ' — ' + n.stage + (n.fromName ? ' · from ' + n.fromName : '') + '</div>' +
      (n.note ? '<div class="notif-meta">"' + n.note.slice(0,60) + (n.note.length>60?'…':'') + '"</div>' : '') +
      '<div class="notif-meta">' + ago + '</div>' +
      '</div>';
  }).join('');
}

function timeAgo(ts) {
  var diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'hr ago';
  return Math.floor(diff/86400) + 'd ago';
}

// Poll for new notifications every 60s
setInterval(updateBell, 60000);
document.addEventListener('DOMContentLoaded', function() { setTimeout(updateBell, 1000); });
</script>
